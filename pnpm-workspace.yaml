packages:
  - 'packages/*'
  - 'examples/*'

# Supply-chain hardening: don't resolve packages published in the last 7
# days (gives time for malicious/broken releases to be caught and pulled),
# block transitive deps from untrusted sources, and never let a lockfile
# update silently downgrade these settings.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

overrides:
  hono: ">=4.12.25"
  undici: ">=7.28.0"

onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver

peerDependencyRules:
  ignoreMissing:
    - monaco-editor
    - yjs
  allowedVersions:
    "mcp-handler>@modelcontextprotocol/sdk": "1.27.1"

packageExtensions:
  "@payloadcms/drizzle":
    dependencies:
      drizzle-kit: "0.31.7"
