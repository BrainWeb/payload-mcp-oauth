name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday — catch newly disclosed vulns

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on high/critical)
        # --prod: audit only production dependencies. devDependencies (vitest,
        # playwright, etc.) are never shipped — the package's `files` is just
        # dist — so a dev-only advisory shouldn't gate releases.
        #
        # Two inputs shape this gate and both need periodic pruning:
        #   • .pnpmfile.cjs   — minimum-version floors for transitive vulns
        #   • package.json    — pnpm.auditConfig.ignoreCves, for advisories with
        #                       NO patched release upstream
        # Delete entries from either as soon as upstream catches up. A stale
        # floor or a lingering ignore makes this job report green on a real vuln.
        run: pnpm audit --prod --audit-level high

      - name: Report suppressed advisories
        # Surfaces what the gate above deliberately ignored, so a permanently
        # suppressed CVE stays visible in the log instead of quietly rotting.
        if: always()
        run: |
          echo "Ignored CVEs (no upstream fix available):"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
            const ignored = pkg.pnpm?.auditConfig?.ignoreCves ?? []
            console.log(ignored.length ? ignored.map((c) => '  ' + c).join('\n') : '  (none)')
          "

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/nodejs \
            --error \
            --sarif \
            --output semgrep.sarif
        env:
          # Optional: set SEMGREP_APP_TOKEN for dashboard reporting
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        # Requires GitHub Advanced Security (free for public repos)
        continue-on-error: true

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Full history so all commits are scanned

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional for public repos
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          languages: javascript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          category: '/language:javascript'
